<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="premiumGold" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFF5B1"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8C20"/>
    </linearGradient>

    <!-- Royal Midnight Blue -->
    <radialGradient id="midnightGrad" cx="256" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </radialGradient>

    <!-- Professional Glow -->
    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="256" cy="256" r="240" fill="url(#midnightGrad)" fill-opacity="0.12"/>

  <!-- The Celestial Dial of Punctuality -->
  <circle cx="256" cy="256" r="215" stroke="url(#premiumGold)" stroke-width="14" stroke-dasharray="4 14" opacity="0.35"/>
  <circle cx="256" cy="256" r="230" stroke="url(#premiumGold)" stroke-width="2" opacity="0.5"/>

  <!-- 5 Prayer Time Markers (Illuminated) -->
  <circle cx="256" cy="26" r="10" fill="#FFD700" filter="url(#aura)"/> <!-- Fajr -->
  <circle cx="486" cy="256" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="340" cy="455" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="172" cy="455" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="26" cy="256" r="8" fill="#FFD700" opacity="0.8"/>

  <!-- "Unity in Jama'at" Premium Figures -->
  <!-- Lead Imam Silhouette (High Detail) -->
  <g filter="url(#aura)">
    <circle cx="256" cy="185" r="24" fill="white"/>
    <path d="M220 220C220 195 235 185 256 185C277 185 292 195 292 220V340H220V220Z" fill="white"/>
    <!-- Prayer stance detail (Gold Inlay) -->
    <path d="M235 340V260C235 245 242 238 256 238C270 238 277 245 277 260V340" stroke="url(#premiumGold)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Community Rows (Structured Unity) -->
  <g opacity="0.5">
    <!-- Left Muqtadi -->
    <circle cx="175" cy="220" r="18" fill="white"/>
    <path d="M145 255C145 235 158 228 175 228C192 228 205 235 205 255V340H145V255Z" fill="white"/>

    <!-- Right Muqtadi -->
    <circle cx="337" cy="220" r="18" fill="white"/>
    <path d="M307 255C307 235 320 228 337 228C354 228 367 235 357 255V340H307V255Z" fill="white"/>
  </g>

  <!-- Foundation Lines (Stability of the Ummah) -->
  <path d="M120 355H392" stroke="url(#premiumGold)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 370H352" stroke="url(#premiumGold)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Crescent of Unity (Floating on top) -->
<!--  <path d="M256 45C240 45 228 58 228 72C228 86 240 99 256 99C272 99 284 86 284 72C284 58 272 45 256 45ZM256 55C262 55 270 62 270 72C270 82 262 89 256 89C250 89 242 82 242 72C242 62 250 55 256 55Z" fill="#FFD700" filter="url(#aura)"/>-->
</svg>
